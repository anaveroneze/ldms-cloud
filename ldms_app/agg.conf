prdcr_listen_add name=computes regex=compute.*
prdcr_listen_start name=computes

updtr_add name=all_sets interval=1s offset=100ms
updtr_prdcr_add name=all_sets regex=.*
updtr_start name=all_sets

load name=store_csv
config name=store_csv path=/home/ubuntu/ldms-csv

strgp_add name=csv_meminfo plugin=store_csv container=ldms_data schema=meminfo
strgp_prdcr_add name=csv_meminfo regex=.*
strgp_start name=csv_meminfo

strgp_add name=csv_vmstat plugin=store_csv container=ldms_data schema=vmstat
strgp_prdcr_add name=csv_vmstat regex=.*
strgp_start name=csv_vmstat

strgp_add name=csv_procstat plugin=store_csv container=ldms_data schema=procstat
strgp_prdcr_add name=csv_procstat regex=.*
strgp_start name=csv_procstat
